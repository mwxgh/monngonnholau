# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
    listen 80;
    server_name monngonnholau.online www.monngonnholau.online api.monngonnholau.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Web (Next.js)
server {
    listen 443 ssl;
    server_name monngonnholau.online www.monngonnholau.online;

    ssl_certificate     /etc/letsencrypt/live/monngonnholau.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monngonnholau.online/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://mnnl-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# API (NestJS)
server {
    listen 443 ssl;
    server_name api.monngonnholau.online;

    ssl_certificate     /etc/letsencrypt/live/api.monngonnholau.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.monngonnholau.online/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://mnnl-api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
