services:
  mnnl-api:
    image: ghcr.io/${GITHUB_OWNER}/mnnl-api:latest
    container_name: mnnl-api
    restart: unless-stopped
    env_file: apps/api/.env

  mnnl-web:
    image: ghcr.io/${GITHUB_OWNER}/mnnl-web:latest
    container_name: mnnl-web
    restart: unless-stopped
    env_file: apps/web/.env

  mnnl-nginx:
    image: nginx:alpine
    container_name: mnnl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - mnnl-api
      - mnnl-web
